plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.timelinear'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:deprecation'
}

// 기본 빌드: 라이브 골든셋(@Tag("live"))은 제외한다. 실제 Anthropic API를 호출해 과금되기 때문.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'live'
	}
}

// 라이브 골든셋만 실행: ./gradlew liveTest  (ANTHROPIC_API_KEY가 환경변수 또는 .env에 있어야 한다)
tasks.register('liveTest', Test) {
	description = 'Runs @Tag("live") tests against the real Anthropic API'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'live'
	}
	// .env의 KEY=value를 환경변수로 넘긴다(Spring 밖에서 도는 테스트라 spring.config.import가 적용되지 않음)
	def envFile = rootProject.file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def m = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$/
			if (m.matches() && !System.getenv(m[0][1])) {
				environment m[0][1], m[0][2]
			}
		}
	}
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed', 'skipped'
	}
	outputs.upToDateWhen { false }
}

// 실행 가능한 jar만 만든다(-plain.jar 생략). Dockerfile이 파일명을 고정해서 복사한다.
jar {
	enabled = false
}
